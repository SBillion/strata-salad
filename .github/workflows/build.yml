name: build-strata-image

# Build the Strata engine image on an x86_64 runner and push it to GHCR.
#
# The model is NOT baked into the image: baked images (tens-of-GB single
# layers) failed to start on SaladCloud ("Instance Start Failure: Other").
# The ~70 GB model is downloaded at container start on Salad's ephemeral
# disk instead (see README).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label"
        type: string
        default: ubuntu-latest
      model:
        description: "Strata model size (image tag; the model itself is chosen at deploy time)"
        type: choice
        options: [IQ2_XS, Q2_0, IQ3_XXS, IQ3_S]
        default: IQ2_XS
      cuda_arch:
        description: "CUDA arch (86 = RTX 3090)"
        type: string
        default: "86"
      strata_ref:
        description: "Strata git ref to build"
        type: string
        default: main
      push:
        description: "Push the image to GHCR"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Strata source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.strata_ref || 'main' }}" \
            https://github.com/Niko1221/Strata.git .strata

      - name: Resolve image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.model || 'IQ2_XS' }}" >>"$GITHUB_ENV"

      - name: Build engine image (x86_64)
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            -t "$IMAGE" \
            --build-arg "CUDA_ARCHITECTURES=${{ inputs.cuda_arch || '86' }}" \
            --build-arg "BUILD_VISION=1" \
            -f .strata/Dockerfile .strata

      - name: Log in to GHCR
        if: ${{ inputs.push != false }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: ${{ inputs.push != false }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE"
